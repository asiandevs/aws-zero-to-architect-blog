# _config.yml
title: AWS Zero to Architect
description: Blog series – from Cloud 101 to production-grade architectures
theme: minima
logo: /assets/images/icons8-aws-logo-100.png
permalink: /:year/:month/:day/:title.html
baseurl: "/aws-zero-to-architect-blog"
# url: "https://asiandevs.github.io"
url: "https://monowar-mukul.github.io"
header_pages:
  - about.md
plugins:
  - jekyll-feed
  - jekyll-seo-tag
main_index_url: "/#module-index"

# Default layout for all posts
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "page"
